name: Plumber CI/CD security scan

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_call:

jobs:
  plumber:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write # OIDC identity required by score-push
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            .plumber.yaml
          persist-credentials: false
      - name: Run Plumber
        uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
        with:
          verify-attestation: true
          config-file: .plumber.yaml
          min-score: B
          soft-fail: false
          upload-sarif: ${{ github.event_name != 'pull_request' }}
          score-push: ${{ github.event_name != 'pull_request' }}
          upload-artifacts: true
